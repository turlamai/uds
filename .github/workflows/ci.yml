name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Preserve every main commit's Windows/macOS/Linux quality evidence.
# Cancel only superseded PR checks, never queued or running main pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket
        uses: Bogdanp/setup-racket@v1.12
        with:
          version: 'stable'
      - name: Reject checked-in generated Scribble output
        shell: bash
        run: |
          if git ls-files -- 'uds/doc/**' | grep -q .; then
            echo "::error::Generated documentation under uds/doc/ must not be committed."
            exit 1
          fi
      - name: Install package
        run: raco pkg install --auto --link "$(pwd)"
      - name: Run tests
        run: raco test -p uds
      - name: Execute synthetic README quickstart
        run: racket uds/examples/quickstart.rkt
      - name: Build Scribble reference and check package dependencies
        run: raco setup --check-pkg-deps -l uds
